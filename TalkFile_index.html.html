<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선희쌤과 함께하는 윤리비티아이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #e0e7ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      padding: 32px 24px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      animation: fadeIn 0.3s ease-in-out forwards;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Start Screen */
    .badge {
      display: inline-block;
      align-self: center;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    h1.title {
      font-size: 1.75rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.35;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .info-card {
      background: #f1f5f9;
      border-radius: 16px;
      padding: 18px;
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .info-card ul {
      padding-left: 20px;
    }

    .info-card li {
      margin-bottom: 4px;
    }

    /* Quiz Screen */
    .quiz-header {
      margin-bottom: 24px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.3s ease;
      border-radius: 9999px;
    }

    .quiz-step {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .question-box {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 24px;
      min-height: 56px;
      color: #0f172a;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 18px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      color: var(--text-main);
    }

    .option-btn:hover {
      border-color: var(--primary);
      background-color: var(--primary-light);
      color: var(--primary);
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    /* Result Screen */
    .result-card {
      text-align: center;
      padding: 16px 0;
    }

    .result-mbti {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .result-name {
      font-size: 1.6rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .result-tagline {
      display: inline-block;
      background: #fef3c7;
      color: #b45309;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 24px;
    }

    .detail-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      margin-bottom: 16px;
    }

    .detail-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .detail-desc {
      font-size: 0.95rem;
      line-height: 1.65;
      color: var(--text-main);
      word-break: keep-all;
    }

    .quote-box {
      background: #faf5ff;
      border: 1px solid #e9d5ff;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      font-style: italic;
      color: #6b21a8;
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* Primary Buttons */
    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- START SCREEN -->
    <div id="screen-start" class="screen active">
      <span class="badge">사회과 부스 체험활동</span>
      <h1 class="title">선희쌤과 함께하는<br>윤리비티아이</h1>
      <p class="subtitle">나의 무의식적 일상 반응으로 알아보는<br>나를 쏙 빼닮은 통합사회 사상가는 누구일까?</p>
      
      <div class="info-card">
        <ul>
          <li>총 35문항으로 구성되어 있습니다.</li>
          <li>정답이 없으니 너무 깊게 고민하지 마세요.</li>
          <li>평소 본인의 자연스러운 반응을 골라주세요!</li>
        </ul>
      </div>

      <button class="btn" onclick="startQuiz()">테스트 시작하기</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="screen-quiz" class="screen">
      <div class="quiz-header">
        <div class="progress-bar-bg">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
        <div class="quiz-step">
          <span id="part-name">Part 1</span>
          <span id="question-number">1 / 35</span>
        </div>
      </div>

      <div id="question-text" class="question-box">질문이 여기에 표시됩니다.</div>

      <div class="options">
        <button id="opt-a" class="option-btn" onclick="handleSelect('A')">선택지 A</button>
        <button id="opt-b" class="option-btn" onclick="handleSelect('B')">선택지 B</button>
      </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-result" class="screen">
      <div class="result-card">
        <div id="res-mbti" class="result-mbti">ISTJ</div>
        <div id="res-name" class="result-name">칸트</div>
        <div id="res-tagline" class="result-tagline">"철벽의 원칙 설계자"</div>

        <div class="quote-box" id="res-quote">
          "너의 의지의 준칙이 언제나 보편적 입법의 원리가 되도록 행위하라."
        </div>

        <div class="detail-box">
          <div class="detail-title">사상가 특징 & 키워드</div>
          <div class="detail-desc" id="res-desc">
            설명이 여기에 표시됩니다.
          </div>
        </div>

        <div class="detail-box">
          <div class="detail-title">통합사회 연계 단원</div>
          <div class="detail-desc" id="res-unit">
            단원 정보
          </div>
        </div>
      </div>

      <button class="btn" onclick="restartQuiz()">다시 테스트하기</button>
    </div>
  </div>

  <script>
    const questions = [
      // Part 1: E vs I (1~8)
      { part: "Part 1. 생각과 자극을 다루는 방식", dim: "EI", q: "머릿속에 번뜩이는 좋은 아이디어가 떠올랐을 때 나는?", a: "입 밖으로 꺼내서 남에게 들려주어야 생각이 선명해진다.", b: "혼자 메모장에 적어보거나 속으로 충분히 다듬은 뒤에 꺼낸다." },
      { part: "Part 1. 생각과 자극을 다루는 방식", dim: "EI", q: "혼자만의 자유 시간이 생겼을 때, 3~4시간이 흐른 뒤 내 마음은?", a: "슬슬 몸이 뻐근해져 바깥세상 소식을 찾거나 나갈 구실을 찾는다.", b: "시간 가는 줄 몰랐고, 방해받지 않는 이 상태가 계속되면 좋겠다." },
      { part: "Part 1. 생각과 자극을 다루는 방식", dim: "EI", q: "수업 중 갑자기 의견을 질문받았을 때 나의 언어 습관은?", a: "\"제 생각은요...\" 하며 일단 말하면서 문장을 완성해 나간다.", b: "속으로 첫 문장과 요점을 1~2초라도 완벽히 정리한 뒤에 입을 연다." },
      { part: "Part 1. 생각과 자극을 다루는 방식", dim: "EI", q: "주변 환경에 소음이 있거나 사람이 웅성거릴 때?", a: "백색소음처럼 느껴져서 오히려 집중이 잘 되거나 방해되지 않는다.", b: "사소한 말소리나 움직임 하나하나가 귀에 걸려 신경이 곤두선다." },
      { part: "Part 1. 생각과 자극을 다루는 방식", dim: "EI", q: "일주일 동안 여러 사건을 겪고 난 뒤, '내 경험'으로 정리되는 순간은?", a: "누군가와 \"이번 주에 이런 일 있었잖아\" 하며 이야기를 나눌 때", b: "잠들기 전 누워서 혼자 하루하루를 조용히 되짚어볼 때" },
      { part: "Part 1. 생각과 자극을 다루는 방식", dim: "EI", q: "친구들과 흥미롭게 대화를 나누는 도중, 나의 리듬은?", a: "상대방 말이 끝나기 무섭게 내 관련 경험이나 생각이 바로 튀어나온다.", b: "상대방 말을 끝까지 듣고, 속으로 한번 소화한 뒤 내 턴을 가진다." },
      { part: "Part 1. 생각과 자극을 다루는 방식", dim: "EI", q: "새로운 공간이나 낯선 환경에 놓였을 때 나의 뇌가 먼저 하는 일은?", a: "주변 인테리어, 물건 위치, 사람들의 분위기 등 바깥 상황을 탐색한다.", b: "이 낯선 공간에서 내가 어떻게 행동해야 할지 내면의 긴장도를 점검한다." },
      { part: "Part 1. 생각과 자극을 다루는 방식", dim: "EI", q: "어떤 분야에 관심이 생겼을 때 나의 행동 패턴은?", a: "관련 동아리를 찾거나, 잘 아는 사람에게 물어보며 배우려 한다.", b: "책, 영상, 검색 자료 등을 혼자 차분히 파고들며 먼저 이해하려 한다." },

      // Part 2: S vs N (9~17)
      { part: "Part 2. 정보를 받아들이는 방식", dim: "SN", q: "사과 한 알을 떠올릴 때 내 뇌리에 먼저 스치는 것은?", a: "빨간 껍질, 한 입 베어 물었을 때의 아삭한 식감과 달콤한 과즙", b: "뉴턴의 만유인력, 백설공주, 혹은 사과의 상징적 이미지" },
      { part: "Part 2. 정보를 받아들이는 방식", dim: "SN", q: "길을 찾아갈 때 내가 더 편하게 의지하는 안내 방식은?", a: "\"편의점 끼고 우회전해서 100m 앞 빨간 벽돌집\" 같은 구체적 지형지물", b: "\"이쪽 방향으로 가다 보면 큰 사거리로 이어짐\" 같은 방위 감각" },
      { part: "Part 2. 정보를 받아들이는 방식", dim: "SN", q: "영화나 웹툰을 볼 때 나를 더 몰입하게 만드는 요소는?", a: "인물들의 현실적인 대사, 생생한 배경 묘사와 연출 디테일", b: "작품 전체를 관통하는 숨겨진 복선, 세계관, 결말의 철학적 메시지" },
      { part: "Part 2. 정보를 받아들이는 방식", dim: "SN", q: "새로운 도구나 앱을 처음 다루게 되었을 때?", a: "사용 설명서나 튜토리얼을 차근차근 확인하며 기본 기능부터 익힌다.", b: "설명서는 넘기고 이것저것 눌러보며 전체 작동 원리를 감으로 파악한다." },
      { part: "Part 2. 정보를 받아들이는 방식", dim: "SN", q: "\"요즘 어때?\"라는 질문을 받았을 때 나의 대답 성향은?", a: "\"수행평가 기간이라 바빠\", \"어제 연습했어\"처럼 최근 일어난 사실 위주", b: "\"뭔가 공허해\", \"새로운 전환점이 필요한 느낌이야\"처럼 내면 흐름 위주" },
      { part: "Part 2. 정보를 받아들이는 방식", dim: "SN", q: "누군가의 설명을 들을 때 더 답답하게 느껴지는 쪽은?", a: "실제 사례나 구체적 수치 없이 뜬구름 잡는 이야기만 늘어놓는 사람", b: "전체적인 맥락이나 핵심 메시지 없이 자잘한 디테일만 나열하는 사람" },
      { part: "Part 2. 정보를 받아들이는 방식", dim: "SN", q: "버스를 타고 멍하니 창밖을 바라볼 때 내 머릿속은?", a: "지나가는 자동차 기종, 가게 간판, 사람들의 걸음걸이를 관찰한다.", b: "생각이 꼬리를 물고 이어져 현실과 무관한 엉뚱한 상상으로 흘러간다." },
      { part: "Part 2. 정보를 받아들이는 방식", dim: "SN", q: "'나무'라는 단어를 들었을 때 내 마음에 더 와닿는 것은?", a: "푸른 잎과 단단한 기둥, 바람에 흔들리는 실물 나무의 생김새", b: "사계절의 순환, 아낌없이 주는 존재, 숲의 고요함 같은 은유적 이미지" },
      { part: "Part 2. 정보를 받아들이는 방식", dim: "SN", q: "역사나 사회 과목을 공부할 때 더 자연스럽게 외워지는 것은?", a: "사건이 발생한 연도, 조약 명칭, 등장인물 이름 등 구체적 팩트", b: "그 사건이 터지게 된 사회적 분위기, 시대의 거대한 흐름과 배경" },

      // Part 3: T vs F (18~26)
      { part: "Part 3. 상황을 분석하고 납득하는 잣대", dim: "TF", q: "잘못된 결과가 나왔을 때, 내 뇌가 본능적으로 먼저 찾는 것은?", a: "어디서 오류가 났는지(시스템, 규칙, 절차상의 문제점)", b: "누가 어떤 부담 때문에 실수를 저질렀는지(당사자의 상황과 심리)" },
      { part: "Part 3. 상황을 분석하고 납득하는 잣대", dim: "TF", q: "누군가의 주장을 들을 때 내가 '설득되었다'고 느끼는 순간은?", a: "전제와 결론 사이에 논리적 모순이 없고 인과관계가 확실할 때", b: "말하는 사람의 진정성이 느껴지고, 관련된 사람들의 입장을 배려했을 때" },
      { part: "Part 3. 상황을 분석하고 납득하는 잣대", dim: "TF", q: "친구가 털어놓는 고민을 들을 때 내 머릿속에 먼저 떠오르는 생각은?", a: "\"이 문제를 해결하려면 일단 A부터 처리하고 B로 넘어가야겠네.\"", b: "\"저런 상황이었으면 혼자 얼마나 답답하고 막막했을까...\"" },

        desc: "말만 번지르르한 이론보다 눈에 보이는 실질적 결과와 효용을 중시하는 실천가입니다. 모든 사람의 고통을 줄이고 기쁨을 극대화할 수 있는 가장 확실하고 가성비 높은 해법을 찾아냅니다.",
        unit: "통합사회 1권: 행복과 공리주의 / 사회 정의의 기준"
      },
      ESFP: {
        name: "밀 (John Stuart Mill)",
        tagline: "품격 있는 즐거움을 아는 미식가",
        quote: "\"배부른 돼지가 되기보다는 차라리 배고픈 소크라테스가 되는 편이 낫다.\"",
        desc: "단순한 자극을 넘어 삶의 질과 정신적인 성숙을 즐길 줄 아는 감각적인 사람입니다. 다른 사람에게 피해를 주지 않는 한 각자의 개성과 자유를 마음껏 꽃피우는 다채로운 세상을 지지합니다.",
        unit: "통합사회 1권: 질적 공리주의 / 자유와 개별성의 가치"
      }
    };

    let currentIndex = 0;
    let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    let firstChoice = "E"; // 1번 문항 동률 판정용

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startQuiz() {
      currentIndex = 0;
      scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
      showScreen('screen-quiz');
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      document.getElementById('part-name').innerText = q.part;
      document.getElementById('question-number').innerText = `${currentIndex + 1} / ${questions.length}`;
      
      const progressPercent = ((currentIndex) / questions.length) * 100;
      document.getElementById('progress-fill').style.width = `${progressPercent}%`;

      document.getElementById('question-text').innerText = q.q;
      document.getElementById('opt-a').innerText = q.a;
      document.getElementById('opt-b').innerText = q.b;
    }

    function handleSelect(choice) {
      const q = questions[currentIndex];
      const traitA = q.dim[0];
      const traitB = q.dim[1];

      if (currentIndex === 0) {
        firstChoice = (choice === 'A') ? 'E' : 'I';
      }

      if (choice === 'A') {
        scores[traitA]++;
      } else {
        scores[traitB]++;
      }

      currentIndex++;
      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        calculateResult();
      }
    }

    function calculateResult() {
      let mbti = "";

      // EI
      if (scores.E > scores.I) mbti += "E";
      else if (scores.I > scores.E) mbti += "I";
      else mbti += firstChoice;

      // SN
      mbti += (scores.S >= scores.N) ? "S" : "N";

      // TF
      mbti += (scores.T >= scores.F) ? "T" : "F";

      // JP
      mbti += (scores.J >= scores.P) ? "J" : "P";

      displayResult(mbti);
    }

    function displayResult(mbti) {
      const data = results[mbti];
      document.getElementById('res-mbti').innerText = mbti;
      document.getElementById('res-name').innerText = data.name;
      document.getElementById('res-tagline').innerText = data.tagline;
      document.getElementById('res-quote').innerText = data.quote;
      document.getElementById('res-desc').innerText = data.desc;
      document.getElementById('res-unit').innerText = data.unit;

      showScreen('screen-result');
    }

    function restartQuiz() {
      showScreen('screen-start');
    }
  </script>
</body>
</html>
